# 本地开发环境：MySQL（+ 可选 API 容器）
#
#   pnpm db:up                        只起数据库
#   docker compose --profile full up   起数据库 + API
#
# ⚠️ 用 MySQL 而非 PostgreSQL：部署目标是微信云托管，云托管只提供 MySQL。
#    本地环境与线上保持同一方言，才不会出现「本地过了线上挂」。
#
# ⚠️ name 显式声明 compose 项目名：否则卷名取决于目录名，
#    目录一改就会生成新卷、丢掉旧数据（本项目就因此踩过）。
#    项目名 jushuo → 卷名 jushuo_mysqldata。
name: jushuo

services:
  db:
    image: mysql:8.4
    container_name: jushuo-db
    # ⚠️ 必须显式 utf8mb4：昵称里会有 emoji，utf8 三字节存不下会直接报错
    command:
      - '--character-set-server=utf8mb4'
      - '--collation-server=utf8mb4_unicode_ci'
    environment:
      MYSQL_DATABASE: jushuo
      MYSQL_USER: jushuo
      MYSQL_PASSWORD: dev
      MYSQL_ROOT_PASSWORD: dev
      # ⚠️ DATETIME 不存时区，容器统一 UTC，应用侧也按 UTC 读写
      TZ: UTC
    ports:
      # ⭐ 宿主机端口可配置：本机已有 MySQL/Postgres 时用 DB_PORT=5544 避开冲突
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-pdev']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile.development
    container_name: jushuo-api
    profiles: ['full']
    ports:
      # ⭐ 必须映射到宿主机，小程序真机才能通过局域网 IP 访问
      - '${API_PORT:-3000}:3000'
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/apps/server/node_modules
      - /app/packages/shared/node_modules
    environment:
      DATABASE_URL: mysql://jushuo:dev@db:3306/jushuo
      # ⚠️ 刻意**不在这里设 ENGINE / STORAGE** —— 它们由根目录 .env.local 决定
      #    （容器里也是 .env + .env.local，见 tools/env.mjs 的分层规则）。
      #    两边都写就是两份真相：改了一处以为生效，实际被另一处盖住。
      # ⚠️ DATABASE_URL 必须在这里给：.env.local 里的那份是给**宿主机**的
      #    （127.0.0.1:5544），容器里得走服务名 db:3306 ——
      #    真实环境变量优先级最高，所以这里能盖住文件里的值。
      NODE_ENV: development
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysqldata:
