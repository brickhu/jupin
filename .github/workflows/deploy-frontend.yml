# 句说 · 前端自动部署
# push 到 main 分支时自动构建前端并上传到阿里云 OSS
#
# 使用前需在 GitHub 仓库 Settings → Secrets and Variables → Actions 中添加：
#   - ALIYUN_ACCESS_KEY_ID     阿里云 RAM 子账号 AccessKey ID
#   - ALIYUN_ACCESS_KEY_SECRET 阿里云 RAM 子账号 AccessKey Secret
#   - OSS_BUCKET               OSS Bucket 名称（如 jushuo-frontend）
#   - OSS_REGION                OSS 地域（如 oss-cn-hangzhou）

name: Deploy Frontend to Aliyun OSS

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 支持手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build project
        run: pnpm build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.jushuo.app

      - name: Setup ossutil
        uses: manyuanrong/setup-ossutil@v3
        with:
          endpoint: ${{ secrets.OSS_REGION }}.aliyuncs.com
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      - name: Sync to OSS
        run: |
          # JS/CSS — 带 hash 文件名，可强缓存 1 年
          ossutil cp dist/ oss://${{ secrets.OSS_BUCKET }}/ \
            --recursive \
            --force \
            --meta "Cache-Control:max-age=31536000" \
            --include "*.js" \
            --include "*.css"

          # HTML — 不缓存，确保用户每次打开都是最新版
          ossutil cp dist/ oss://${{ secrets.OSS_BUCKET }}/ \
            --recursive \
            --force \
            --meta "Cache-Control:no-cache" \
            --include "*.html"

          # 其他资源（图片、字体等）— 中等缓存 7 天
          ossutil cp dist/ oss://${{ secrets.OSS_BUCKET }}/ \
            --recursive \
            --force \
            --meta "Cache-Control:max-age=604800" \
            --exclude "*.js" \
            --exclude "*.css" \
            --exclude "*.html"

      - name: Notify success
        run: echo "✅ Frontend deployed to https://jushuo.app"