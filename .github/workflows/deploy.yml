# ============================================================
#  CI 部署：分支 → 环境
#
#    dev  分支  →  云托管 dev 环境（自动）
#    main 分支  →  云托管 prod 环境（自动；建议在 GitHub 上给 prod environment
#                 配 Required reviewers，把它变成人工确认）
#
#  ⚠️ 为什么用 tools/deploy-cloud.mjs 而不是裸的 wxcloud run:deploy：
#     云托管的**服务环境变量是整份覆盖的** —— 裸命令得自己拼 --envParamsJson，
#     少写一个键就把数据库连接信息冲掉，服务直接连不上库。
#     脚本会先读回当前配置再合并，并自动补 COS_BUCKET / COS_REGION / TOKEN_SECRET。
#
#  ⚠️ 环境变量来自 **GitHub Secrets**，不是仓库里的 .env（那些是 gitignore 的）。
#     加载优先级是「真实环境变量 > .env.<mode> > .env」，所以 CI 里直接给进程变量即可，
#     runner 上不需要落任何 .env 文件。
#
#  ⭐ 这些值**本地 .env / .env.<env> 里全都有**，不用手抄：
#       node tools/gh-secrets.mjs dev           # 先看要设哪些（默认不打印值）
#       node tools/gh-secrets.mjs dev --apply   # gh auth login 之后一次设完
#
#  需要的 secrets（推荐按 **Environment** 各配一份，见 AGENT.md §4.2）：
#    账号级（dev/prod 同值）：WXCLOUD_APPID / WXCLOUD_CLI_SECRET
#                            XFYUN_APP_ID / XFYUN_API_KEY / XFYUN_API_SECRET
#                            WX_APPID / WX_SECRET
#    环境级（dev 与 prod 不同）：WXCLOUD_ENV_ID
#                              MYSQL_ADDRESS / MYSQL_USERNAME / MYSQL_PASSWORD / MYSQL_DATABASE
#                              TOKEN_SECRET ⚠️ 各环境必须不同且不能省 ——
#                                          省了脚本会现生成一个，而 runner 是临时的，
#                                          等于每次部署都换密钥，登录态全掉
# ============================================================
name: Deploy

on:
  push:
    branches: [dev, main]
    # 纯文档 / 纯小程序改动不触发后端部署（后端镜像里没有小程序代码）
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'apps/miniprogram/**'

# ⚠️ 同一分支的部署串行：云托管同一服务同一时刻只允许一个发布任务，并发直接报 ResourceInUse。
#
# ⚠️⚠️ cancel-in-progress 从 false 改成 true（2026-09-29，起因是一次真实的死等）：
#    事实经过：一次部署卡在平台侧"创建构建镜像"那一步（脚本注释里记过），
#    而**它自己不会结束**（脚本内的超时上限加起来可达 ~80 分钟）。
#    由于 cancel-in-progress=false，后面每一次推送都只能**排队**：
#    run 80 就这样干等了 30+ 分钟，dev 一直停在旧版本，人看到的只是"部署了但没变"。
#    ⇒ 部署流水线应当**后来的取代先前的**（旧提交本来也没必要再发一次），
#      取消旧 run 不会回滚平台侧已创建的版本——它只是让我们这边别再等。
#      dev 与 main 的 group 不同（按 ref 分），所以推 dev 不会打断 prod 的发布。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------
  # dev 分支 → dev 环境
  # ----------------------------------------------------------------
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    # ⚠️ **必须有超时** ✗ —— 没有它，一次真卡住会白等 GitHub 的默认上限（6 小时 ✗）
    #    ⭐ 25 分钟的依据：实测一次完整部署（build + 跨洋 push + 平台拉起）约 10-15 分钟 ✓
    #       ⚠️ 首次推全部层会更久 ✓ 所以给到 25 而不是 15 ✓
    timeout-minutes: 25
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ⭐ 检查不过就不部署 —— 云上那份是用户直接用的
      - name: 类型检查与测试
        run: |
          pnpm typecheck
          pnpm test

      - name: 检查 secrets 是否配齐
        env:
          WXCLOUD_APPID: ${{ secrets.WXCLOUD_APPID }}
          WXCLOUD_CLI_SECRET: ${{ secrets.WXCLOUD_CLI_SECRET }}
          WXCLOUD_ENV_ID: ${{ secrets.WXCLOUD_ENV_ID }}
          MYSQL_ADDRESS: ${{ secrets.MYSQL_ADDRESS }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          # ⭐ 内容管理接口口令（tools/admin 用）。⚠️ 必须在这里传：
          #    服务环境变量是整份覆盖的，workflow 不传 = 部署时把它清掉。
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          # ⚠️ 虚拟支付：两把 AppKey 都要齐（dev 走沙箱那把、prod 走现网那把）
          XPAY_OFFER_ID: ${{ secrets.XPAY_OFFER_ID }}
          XPAY_APP_KEY: ${{ secrets.XPAY_APP_KEY }}
          XPAY_SANDBOX_APP_KEY: ${{ secrets.XPAY_SANDBOX_APP_KEY }}
        run: |
          missing=""
          for k in WXCLOUD_APPID WXCLOUD_CLI_SECRET WXCLOUD_ENV_ID MYSQL_ADDRESS MYSQL_USERNAME MYSQL_PASSWORD TOKEN_SECRET XPAY_OFFER_ID XPAY_APP_KEY XPAY_SANDBOX_APP_KEY; do
            eval "v=\$"$k
            [ -z "$v" ] && missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少 secrets:$missing（配法见 AGENT.md §4.2）"
            exit 1
          fi
          echo "secrets 齐全"

      - name: 登录云托管
        env:
          WXCLOUD_APPID: ${{ secrets.WXCLOUD_APPID }}
          WXCLOUD_CLI_SECRET: ${{ secrets.WXCLOUD_CLI_SECRET }}
        run: ./node_modules/.bin/wxcloud login --appId "$WXCLOUD_APPID" --privateKey "$WXCLOUD_CLI_SECRET"

      - name: 部署到 dev
        env:
          WXCLOUD_APPID: ${{ secrets.WXCLOUD_APPID }}
          WXCLOUD_CLI_SECRET: ${{ secrets.WXCLOUD_CLI_SECRET }}
          WXCLOUD_ENV_ID: ${{ secrets.WXCLOUD_ENV_ID }}
          MYSQL_ADDRESS: ${{ secrets.MYSQL_ADDRESS }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          # ⭐ 内容管理接口口令（tools/admin 用）。⚠️ 必须在这里传：
          #    服务环境变量是整份覆盖的，workflow 不传 = 部署时把它清掉。
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          XFYUN_APP_ID: ${{ secrets.XFYUN_APP_ID }}
          XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
          XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_SECRET: ${{ secrets.WX_SECRET }}
          # ⭐ 虚拟支付。⚠️ XPAY_ENV 刻意**不在这里** —— 它由 deploy 脚本按目标环境写死
          #    （dev=沙箱 / prod=现网），避免有人手填成现网、测试时真扣钱。
          XPAY_OFFER_ID: ${{ secrets.XPAY_OFFER_ID }}
          XPAY_APP_KEY: ${{ secrets.XPAY_APP_KEY }}
          XPAY_SANDBOX_APP_KEY: ${{ secrets.XPAY_SANDBOX_APP_KEY }}
          XPAY_PRODUCT_ENERGY_10: ${{ secrets.XPAY_PRODUCT_ENERGY_10 }}
          XPAY_PRODUCT_ENERGY_300: ${{ secrets.XPAY_PRODUCT_ENERGY_300 }}
          XPAY_PRODUCT_ENERGY_3000: ${{ secrets.XPAY_PRODUCT_ENERGY_3000 }}
          ENGINE: xfyun
          # ⭐⭐ AI 教练的大模型（2026-10-08 从"没人管"提成 Environment secret ✓）
          #    ⚠️ 在此之前它们只在 .env.<env> 里 ⇒ CI 里靠"读回平台" ⇒ GitHub 不掩码 ✗
          #    ⇒ ⭐ 实测 LLM_API_KEY 被 wxcloud CLI 明文打进日志 4 次 ✗ 现在是 secret ✓ 自动掩码 ✓
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          # ⭐⭐ 镜像仓库凭据（`--image` 用；见 tools/deploy-cloud.mjs 的 --image 说明）
          CCR_USERNAME: ${{ secrets.CCR_USERNAME }}
          CCR_PASSWORD: ${{ secrets.CCR_PASSWORD }}
        run: |
          # ⭐⭐ **直接走云托管自带的源构建**（2026-10-08 用户点破）
          #
          # ⚠️ 为什么不再自己打镜像（`--image`）：
          #    `dcf6464` 当初加它是为了绕开"平台侧卡死在 create_build_image" ✓
          #    ⚠️ 但那次真实的 400 是**另一回事** —— 是**我们**把代码包撑大了 ✗：
          #       `--targetDir '.'` 把整个工作区打包，而 CI 里 `pnpm install` 过
          #       ⇒ 混进 **484MB 的 node_modules** ⇒ 6 分钟上传 + `400` ✗✗
          #    ⭐ 那个已经修了（脚本改成 `git archive` 出干净目录 ⇒ **8.7MB** ✓）
          #
          # ⭐ 而源构建这条路**本来就更好**：
          #    · **在国内构建**（腾讯云）✓ 没有跨洋传输 ✗
          #    · **不需要镜像仓库**（省掉 CCR 凭据那一整套 ✓）
          #    · 上传 8.7MB ⇒ 秒传 ✓
          #
          # ⚠️ `--image` 仍然保留，卡住时可手动用（见 tools/deploy-cloud.mjs 的说明）
          node tools/deploy-cloud.mjs dev --remark "CI dev ${{ github.sha }}"

  # ----------------------------------------------------------------
  # main 分支 → prod 环境
  # ----------------------------------------------------------------
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    # ⚠️ **必须有超时** ✗ —— 没有它，一次真卡住会白等 GitHub 的默认上限（6 小时 ✗）
    #    ⭐ 25 分钟的依据：实测一次完整部署（build + 跨洋 push + 平台拉起）约 10-15 分钟 ✓
    #       ⚠️ 首次推全部层会更久 ✓ 所以给到 25 而不是 15 ✓
    timeout-minutes: 25
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 类型检查与测试
        run: |
          pnpm typecheck
          pnpm test

      - name: 检查 secrets 是否配齐
        env:
          WXCLOUD_APPID: ${{ secrets.WXCLOUD_APPID }}
          WXCLOUD_CLI_SECRET: ${{ secrets.WXCLOUD_CLI_SECRET }}
          WXCLOUD_ENV_ID: ${{ secrets.WXCLOUD_ENV_ID }}
          MYSQL_ADDRESS: ${{ secrets.MYSQL_ADDRESS }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          # ⭐ 内容管理接口口令（tools/admin 用）。⚠️ 必须在这里传：
          #    服务环境变量是整份覆盖的，workflow 不传 = 部署时把它清掉。
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          # ⚠️ 虚拟支付：两把 AppKey 都要齐（dev 走沙箱那把、prod 走现网那把）
          XPAY_OFFER_ID: ${{ secrets.XPAY_OFFER_ID }}
          XPAY_APP_KEY: ${{ secrets.XPAY_APP_KEY }}
          XPAY_SANDBOX_APP_KEY: ${{ secrets.XPAY_SANDBOX_APP_KEY }}
        run: |
          missing=""
          for k in WXCLOUD_APPID WXCLOUD_CLI_SECRET WXCLOUD_ENV_ID MYSQL_ADDRESS MYSQL_USERNAME MYSQL_PASSWORD TOKEN_SECRET XPAY_OFFER_ID XPAY_APP_KEY XPAY_SANDBOX_APP_KEY; do
            eval "v=\$"$k
            [ -z "$v" ] && missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少 secrets:$missing（配法见 AGENT.md §4.2）"
            exit 1
          fi
          echo "secrets 齐全"

      - name: 登录云托管
        env:
          WXCLOUD_APPID: ${{ secrets.WXCLOUD_APPID }}
          WXCLOUD_CLI_SECRET: ${{ secrets.WXCLOUD_CLI_SECRET }}
        run: ./node_modules/.bin/wxcloud login --appId "$WXCLOUD_APPID" --privateKey "$WXCLOUD_CLI_SECRET"

      - name: 部署到 prod
        env:
          WXCLOUD_APPID: ${{ secrets.WXCLOUD_APPID }}
          WXCLOUD_CLI_SECRET: ${{ secrets.WXCLOUD_CLI_SECRET }}
          WXCLOUD_ENV_ID: ${{ secrets.WXCLOUD_ENV_ID }}
          MYSQL_ADDRESS: ${{ secrets.MYSQL_ADDRESS }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          # ⭐ 内容管理接口口令（tools/admin 用）。⚠️ 必须在这里传：
          #    服务环境变量是整份覆盖的，workflow 不传 = 部署时把它清掉。
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          XFYUN_APP_ID: ${{ secrets.XFYUN_APP_ID }}
          XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
          XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_SECRET: ${{ secrets.WX_SECRET }}
          ENGINE: xfyun
          # ⭐ 虚拟支付。⚠️ XPAY_ENV 刻意不在这里：deploy 脚本按目标环境写死（prod=0 现网）
          XPAY_OFFER_ID: ${{ secrets.XPAY_OFFER_ID }}
          XPAY_APP_KEY: ${{ secrets.XPAY_APP_KEY }}
          XPAY_SANDBOX_APP_KEY: ${{ secrets.XPAY_SANDBOX_APP_KEY }}
          XPAY_PRODUCT_ENERGY_10: ${{ secrets.XPAY_PRODUCT_ENERGY_10 }}
          XPAY_PRODUCT_ENERGY_300: ${{ secrets.XPAY_PRODUCT_ENERGY_300 }}
          XPAY_PRODUCT_ENERGY_3000: ${{ secrets.XPAY_PRODUCT_ENERGY_3000 }}
          # ⭐⭐ AI 教练的大模型（2026-10-08 从"没人管"提成 Environment secret ✓）
          #    ⚠️ 在此之前只在 .env.<env> 里 ⇒ CI 里靠"读回平台" ⇒ GitHub 不掩码 ✗
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          # ⚠️ prod 默认**不灌种子**（deploy 脚本里 target 为 prod 时是 false）。
          #    首次部署 prod 时把仓库变量 SEED_ON_START 设为 true 跑一次，
          #    否则 prod 句库是空的 —— 朗读页读不到正文。
          SEED_ON_START: ${{ vars.SEED_ON_START }}
          # ⭐⭐ 镜像仓库凭据（`--image` 用；见 tools/deploy-cloud.mjs 的 --image 说明）
          CCR_USERNAME: ${{ secrets.CCR_USERNAME }}
          CCR_PASSWORD: ${{ secrets.CCR_PASSWORD }}
        run: |
          # ⭐⭐ **直接走云托管自带的源构建**（2026-10-08 用户点破）
          #
          # ⚠️ 为什么不再自己打镜像（`--image`）：
          #    `dcf6464` 当初加它是为了绕开"平台侧卡死在 create_build_image" ✓
          #    ⚠️ 但那次真实的 400 是**另一回事** —— 是**我们**把代码包撑大了 ✗：
          #       `--targetDir '.'` 把整个工作区打包，而 CI 里 `pnpm install` 过
          #       ⇒ 混进 **484MB 的 node_modules** ⇒ 6 分钟上传 + `400` ✗✗
          #    ⭐ 那个已经修了（脚本改成 `git archive` 出干净目录 ⇒ **8.7MB** ✓）
          #
          # ⭐ 而源构建这条路**本来就更好**：
          #    · **在国内构建**（腾讯云）✓ 没有跨洋传输 ✗
          #    · **不需要镜像仓库**（省掉 CCR 凭据那一整套 ✓）
          #    · 上传 8.7MB ⇒ 秒传 ✓
          #
          # ⚠️ `--image` 仍然保留，卡住时可手动用（见 tools/deploy-cloud.mjs 的说明）
          node tools/deploy-cloud.mjs prod --remark "CI prod ${{ github.sha }}"
